<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答辩控制台 · 演示脚手架</title>
<style>
  :root{
    --bg:#0d1219; --panel:#151d27; --panel-2:#1b2531; --line:#26313e;
    --ink:#dbe6f2; --ink-dim:#8fa1b5; --ink-faint:#5c6d80;
    --cyan:#3fd0e0; --cyan-dim:#1d6b75;
    --red:#f0625e; --amber:#f2b45c; --green:#5ad1a0;
    --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:baseline;justify-content:space-between;
    padding:22px 28px 18px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.5px}
  h1 em{font-style:normal;color:var(--amber)}
  .sub{color:var(--ink-dim);font-size:12px;margin-top:6px}
  .sub b{color:var(--amber);font-weight:600}
  .right{text-align:right;font-size:12px;color:var(--ink-faint)}
  .right a{color:var(--cyan);text-decoration:none;border-bottom:1px solid var(--cyan-dim);margin-left:14px}
  main{padding:22px 28px 30px;max-width:1200px;margin:0 auto}
  .lights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:14px 16px 13px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
  .kpi.red::before{background:var(--red)} .kpi.green::before{background:var(--green)}
  .kpi .label{font-size:12px;color:var(--ink-dim);letter-spacing:.3px}
  .kpi .value{font:600 24px/1.2 var(--mono);margin-top:8px;color:var(--cyan);
    font-variant-numeric:tabular-nums}
  .kpi.red .value{color:var(--red)} .kpi.green .value{color:var(--green)}
  .kpi .note{font-size:11px;color:var(--ink-faint);margin-top:6px}
  .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  .act{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
  .act h3{margin:0 0 6px;font-size:14px}
  .act p{margin:0 0 10px;font-size:12px;color:var(--ink-dim);min-height:34px}
  .act .eff{font-size:11px;color:var(--ink-faint);display:block;margin-bottom:10px}
  button{font:600 13px var(--mono);color:#08131a;background:var(--cyan);border:0;
    border-radius:4px;padding:9px 18px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{background:#2a3644;color:var(--ink-faint);cursor:not-allowed}
  .warn{background:var(--amber)}
  .runbar{margin-top:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:12px 16px;display:flex;gap:14px;align-items:center;font-size:12px}
  .runbar .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .runbar.busy .dot{background:var(--amber);animation:pulse 1s infinite}
  .runbar.bad .dot{background:var(--red)}
  @keyframes pulse{50%{opacity:.35}}
  pre{margin:16px 0 0;background:#0a0f15;border:1px solid var(--line);border-radius:6px;
    padding:14px 16px;font:12px/1.6 var(--mono);color:#c8d6e5;height:340px;overflow:auto;
    white-space:pre-wrap;word-break:break-all}
  pre .ok{color:var(--green)} pre .no{color:var(--red)} pre .dim{color:var(--ink-faint)}
  .foot{margin-top:12px;font-size:11px;color:var(--ink-faint);line-height:1.7}
</style>
</head>
<body>
<header>
  <div>
    <h1>答辩<em>控制台</em></h1>
    <div class="sub"><b>演示脚手架，不是产品功能</b>：它只负责按下按钮、看到输出；每个动作跑的都是 <code>fde-diagnosis-agent/scripts</code> 里既有的脚本</div>
  </div>
  <div class="right">
    <a href="/console">中控台 →</a><a href="/problem?alert=1">明细页 →</a><a href="/app/">客户端 →</a>
  </div>
</header>
<main>
  <div class="lights">
    <div class="kpi" id="k-events">
      <div class="label">在开事件</div>
      <div class="value" id="v-events">…</div>
      <div class="note">读的是 <code>gov_alert</code>，同一套只读账号</div>
    </div>
    <div class="kpi" id="k-patrol">
      <div class="label">最近一次巡检</div>
      <div class="value" id="v-patrol" style="font-size:16px">…</div>
      <div class="note">与计划任务同一个入口（<code>patrol_hourly.py</code>）</div>
    </div>
    <div class="kpi" id="k-run">
      <div class="label">当前动作</div>
      <div class="value" id="v-run" style="font-size:16px">空闲</div>
      <div class="note" id="n-run">一次只跑一个；双击不会演两遍</div>
    </div>
  </div>

  <div class="acts" id="acts"></div>

  <div class="runbar" id="runbar">
    <span class="dot"></span><span id="rb-text">就绪</span>
    <span style="margin-left:auto;color:var(--ink-faint)" id="rb-exit"></span>
  </div>

  <pre id="log">（点一个按钮，这里出输出；先点「开始巡检」）</pre>

  <div class="foot">
    这页能 spawn 进程，所以只接受本机调用（<code>127.0.0.1</code>）；客户环境用 <code>FDE_DEMO_OFF=1</code> 关掉，不要带到交付现场。</div>
</main>

<script>
const ORDER = ["patrol","probe","closeout","export"];
let since = 0, timer = null, busy = false;

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function paint(state){
  document.getElementById("v-events").textContent = (state.open_events ?? "—");
  document.getElementById("k-events").className = "kpi" + ((state.open_events||0) > 0 ? " red" : " green");
  const lp = state.last_patrol;
  document.getElementById("v-patrol").textContent = lp ? (lp.at.replace("T"," ").slice(0,16) + " · " + lp.status) : "还没跑过";
  document.getElementById("k-patrol").className = "kpi" + (lp ? (lp.status === "ok" ? " green" : " red") : "");
  busy = !!state.busy;
  const run = document.getElementById("v-run");
  if(busy){ run.textContent = state.action + " 运行中"; }
  else if(state.exit === null || state.exit === undefined){ run.textContent = "空闲"; }
  else { run.textContent = state.action + " → exit " + state.exit; }
  document.getElementById("k-run").className = "kpi" + (busy ? "" : (state.exit === 0 ? " green" : (state.exit ? " red" : "")));
  const rb = document.getElementById("runbar");
  rb.className = "runbar" + (busy ? " busy" : (state.exit && !busy ? " bad" : ""));
  document.getElementById("rb-text").textContent =
    busy ? ("正在跑：" + state.action + "（" + (state.started||"") + " 开始）")
         : (state.ended ? ("上一次结束 " + state.ended) : "就绪");
  document.getElementById("rb-exit").textContent =
    state.exit === null || state.exit === undefined ? "" :
    ("exit " + state.exit + " · 日志 " + (state.log || ""));
  document.getElementById("n-run").textContent = state.note || "一次只跑一个；双击不会演两遍";
  if(state.off){ document.getElementById("runbar").className = "runbar bad";
    document.getElementById("rb-text").textContent = "这页被 FDE_DEMO_OFF=1 关掉了"; }
  document.querySelectorAll("button[data-a]").forEach(b=>{ b.disabled = busy || state.off; });
}

function renderActions(state){
  const box = document.getElementById("acts");
  if(box.dataset.init === "1") return;
  box.dataset.init = "1";
  ORDER.forEach((k,i)=>{
    const a = (state.actions||{})[k] || {desc:"", effect:""};
    const d = document.createElement("div");
    d.className = "act";
    d.innerHTML = `<h3>${i+1}. ${["开始巡检","演红","收口彩排","生成处置清单"][i]} <small style="color:var(--ink-faint);font-weight:400">${k}</small></h3><p>${esc(a.desc)}</p>
      <span class="eff">${esc(a.effect)}</span>
      <button data-a="${k}" class="${k==='probe'?'warn':''}">${["跑一遍巡检","演一次红","彩排一次","导出一次"][i]}</button>`;
    box.appendChild(d);
  });
  box.querySelectorAll("button[data-a]").forEach(b=>{
    b.onclick = async ()=>{
      if(busy) return;
      document.getElementById("log").textContent = "（已提交，等输出…）";
      since = 0;
      const r = await fetch("/demo/api/run/" + b.dataset.a, {method:"POST"});
      const j = await r.json();
      if(!r.ok){ document.getElementById("log").textContent = "[" + r.status + "] " + (j.error||""); return; }
      poll();
    };
  });
}

async function tick(){
  try{
    const s = await (await fetch("/demo/api/state")).json();
    renderActions(s); paint(s);
    if(!s.busy && s.log){ await pull(s); }
  }catch(e){ /* 页面还在，网断了就先不刷 */ }
}

async function pull(){
  const r = await fetch("/demo/api/log?since=" + since);
  const j = await r.json();
  if(j.error){ return; }
  if(j.chunk){
    const pre = document.getElementById("log");
    if(since === 0) pre.textContent = "";
    pre.appendChild(document.createTextNode(j.chunk));
    pre.scrollTop = pre.scrollHeight;
    since = j.next;
  }
}

function poll(){
  clearInterval(timer);
  timer = setInterval(async ()=>{
    const s = await (await fetch("/demo/api/state")).json();
    renderActions(s); paint(s);
    if(s.log) await pull(s);
    if(!s.busy && s.exit !== null){ clearInterval(timer); setTimeout(tick, 600); }
  }, 800);
}

tick(); setInterval(tick, 5000);
</script>
</body>
</html>
